edition             = "2021"
max_width           = 100
tab_spaces          = 4
newline_style       = "Unix"
use_small_heuristics = "Default"
reorder_imports     = true
reorder_modules     = true
use_field_init_shorthand = true
use_try_shorthand   = true

# Nightly-only options — silently ignored by stable rustfmt but printed as
# warnings on every `cargo fmt` invocation. Re-enable when the workspace
# moves to nightly (and uncomment in `.cargo/config.toml`'s `rustflags`).
# imports_granularity = "Crate"
# group_imports       = "StdExternalCrate"
