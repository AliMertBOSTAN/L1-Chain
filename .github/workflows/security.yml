name: Security Hardening

on:
  schedule:
    # Weekly security checks (Monday 02:00 UTC)
    - cron: '0 2 * * 1'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit --deny warnings
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: audit-report
          path: audit.json

  deny:
    name: Dependency Policy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo deny
        run: cargo deny check all
      - name: Upload deny report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: deny-report
          path: deny-report.json

  geiger:
    name: Unsafe Code Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-geiger
        run: cargo install cargo-geiger
      - name: Scan for unsafe code
        run: cargo geiger --output Json > geiger.json
      - name: Upload geiger report
        uses: actions/upload-artifact@v3
        with:
          name: geiger-report
          path: geiger.json
      - name: Fail if unsafe code found
        run: |
          COUNT=$(cargo geiger --output Json | jq '.used[0]')
          if [ "$COUNT" -gt "0" ]; then
            echo "ERROR: Unsafe code detected in production code ($COUNT uses)"
            exit 1
          fi

  fuzz-smoke:
    name: Fuzz Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz targets (60 seconds each)
        run: |
          cd fuzz
          for target in tx_parser script_vm network_envelope; do
            echo "Fuzzing $target..."
            timeout 120 cargo +nightly fuzz run "$target" --release -- -max_total_time=60 || true
          done
      - name: Upload fuzz corpus
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: fuzz-corpus
          path: fuzz/corpus/

  clippy:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Run clippy
        run: cargo clippy --all --release -- -D warnings

  fmt:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --all -- --check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage report
        run: cargo tarpaulin --all --out Xml --timeout 300
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
      - name: Check coverage threshold (80%)
        run: |
          COVERAGE=$(cargo tarpaulin --all --out Xml 2>/dev/null | grep -oP 'line-rate="\K[^"]+' | head -1)
          if (( $(echo "$COVERAGE < 0.80" | bc -l) )); then
            echo "ERROR: Code coverage below 80% ($COVERAGE)"
            exit 1
          fi

  threat-model-check:
    name: Threat Model Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check threat model files exist
        run: |
          test -f docs/threat-model/README.md
          test -f docs/threat-model/qv-crypto.md
          test -f docs/threat-model/qv-core.md
          test -f docs/threat-model/qv-script.md
          test -f docs/threat-model/qv-consensus.md
          test -f docs/threat-model/qv-storage.md
          test -f docs/threat-model/qv-net.md
          test -f docs/threat-model/qv-mempool.md
          test -f docs/threat-model/qv-privacy.md
          test -f docs/threat-model/qv-defi.md
          test -f docs/threat-model/qv-node.md
          test -f docs/threat-model/qv-wallet.md
          test -f docs/threat-model/qv-miner.md
      - name: Validate SECURITY.md
        run: test -f SECURITY.md && grep -q "Vulnerability Disclosure" SECURITY.md

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [ audit, deny, geiger, fuzz-smoke, clippy, fmt, coverage ]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Security Hardening Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Policy | ${{ needs.deny.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unsafe Code | ${{ needs.geiger.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fuzz Tests | ${{ needs.fuzz-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linting | ${{ needs.clippy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ${{ needs.fmt.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
