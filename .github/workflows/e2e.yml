name: E2E Test Suite

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:

# Only run when PR has 'e2e' label or on manual trigger
jobs:
  e2e:
    # Only run if PR has 'e2e' label
    if: contains(github.event.pull_request.labels.*.name, 'e2e') || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        # Toolchain pinned in `rust-toolchain.toml` (1.85, edition2024).
        # `dtolnay/rust-toolchain` reads that file automatically; the
        # explicit `toolchain:` arg below is a defensive fallback.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liboqs-dev \
            libssl-dev \
            pkg-config \
            jq \
            curl

      - name: Build workspace
        run: |
          cargo build --release --bins \
            -p qv-node \
            -p qv-wallet \
            -p qv-miner

      - name: Set up Docker
        run: |
          # Docker is pre-installed on ubuntu-latest
          docker --version
          docker-compose --version

      - name: Generate genesis config
        working-directory: devnet
        run: bash scripts/genesis.sh

      - name: Build Docker image
        working-directory: devnet
        run: docker-compose build

      - name: Run e2e tests
        timeout-minutes: 30
        working-directory: .
        run: bash tests/e2e/run_all.sh

      - name: Collect test logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Status ==="
          docker-compose -f devnet/docker-compose.yml ps || true

          echo "=== Service Logs ==="
          docker-compose -f devnet/docker-compose.yml logs --tail=50 || true

          echo "=== E2E Test Logs ==="
          ls -lh /tmp/qv-e2e-logs/ || true
          cat /tmp/qv-e2e-logs/*.log || true

      - name: Cleanup
        if: always()
        working-directory: devnet
        run: |
          docker-compose down --volumes --remove-orphans || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-logs
          path: /tmp/qv-e2e-logs/
          retention-days: 30

  # Label check: ensure PR has appropriate labels
  label-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check labels
        if: github.event_name == 'pull_request'
        run: |
          labels="${{ join(github.event.pull_request.labels.*.name) }}"
          if [[ ! "$labels" =~ "e2e" ]]; then
            echo "⚠️  Add 'e2e' label to run e2e tests"
            exit 0  # Don't fail, just inform
          fi
