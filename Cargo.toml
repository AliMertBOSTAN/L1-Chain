[workspace]
resolver = "2"
members = [
    "crates/qv-common",
    "crates/qv-crypto",
    "crates/qv-core",
    "crates/qv-script",
    "crates/qv-consensus",
    "crates/qv-privacy",
    "crates/qv-storage",
    "crates/qv-net",
    "crates/qv-mempool",
    "crates/qv-defi",
    "crates/qv-node",
    "crates/qv-wallet",
    "crates/qv-miner",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.78"
license      = "Apache-2.0 OR MIT"
authors      = ["QuantumVault Contributors"]
repository   = "https://github.com/quantumvault/quantumvault"

[workspace.lints.rust]
unsafe_code                 = "deny"
missing_docs                = "warn"
rust_2018_idioms            = "warn"
unreachable_pub             = "warn"
unused_qualifications       = "warn"

[workspace.lints.clippy]
all              = { level = "warn", priority = -1 }
pedantic         = { level = "warn", priority = -1 }
nursery          = { level = "warn", priority = -1 }
# Noise we don't care about in a research codebase:
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
# Safety-critical: deny these.
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
indexing_slicing   = "deny"
integer_division   = "deny"
float_arithmetic   = "deny"

[workspace.dependencies]
# --- async / runtime ---
tokio      = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7" }
futures    = "0.3"

# --- error / logging ---
thiserror  = "1.0"
anyhow     = "1.0"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- serialization ---
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode    = "1.3"
hex        = "0.4"
rkyv       = { version = "0.7", features = ["validation"] }

# --- crypto (classical) ---
sha3             = "0.10"
blake3           = "=1.5.4"
x25519-dalek     = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek    = "2.1"
curve25519-dalek = "4.1"
rand_core        = { version = "0.6", features = ["getrandom"] }
rand             = "0.8"
zeroize          = { version = "1.7", features = ["zeroize_derive"] }
secrecy          = "0.8"
subtle           = "2.5"

# --- crypto (post-quantum) ---
# pqcrypto-dilithium / pqcrypto-kyber wrap liboqs-style primitives.
pqcrypto-dilithium  = "0.5"
pqcrypto-kyber      = "0.8"
pqcrypto-traits     = "0.3"

# --- storage ---
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
redb    = "=2.1.3"

# --- networking ---
libp2p = { version = "0.54", features = [
    "tokio", "tcp", "noise", "yamux", "gossipsub",
    "kad", "identify", "ping", "macros", "request-response"
] }

# --- rpc ---
jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }
async-trait = "0.1"

# --- metrics ---
metrics = "0.22"
metrics-exporter-prometheus = "0.14"

# --- utility ---
parking_lot    = "0.12"
dashmap        = "5.5"
arc-swap       = "1.7"
smallvec       = { version = "1.13", features = ["union", "serde"] }
bytes          = "1.6"
clap           = { version = "4.5", features = ["derive", "env"] }
config         = "0.14"
toml           = "0.8"

# --- wallet & crypto utilities ---
bip39              = "2"
argon2             = "0.5"
password-hash      = "0.5"
aes-gcm            = "0.10"
base64             = "0.22"
pbkdf2             = "0.12"
hmac               = "0.12"
sha2               = "0.10"
rpassword          = "7.3"
tempfile           = "3.10"

# --- testing / benchmarking ---
criterion      = { version = "0.5", features = ["html_reports"] }
proptest       = "1.4"
quickcheck     = "1.0"
mockall        = "0.12"

# --- internal crate aliases ---
qv-common      = { path = "crates/qv-common" }
qv-crypto      = { path = "crates/qv-crypto" }
qv-core        = { path = "crates/qv-core" }
qv-script      = { path = "crates/qv-script" }
qv-consensus   = { path = "crates/qv-consensus" }
qv-privacy     = { path = "crates/qv-privacy" }
qv-storage     = { path = "crates/qv-storage" }
qv-net         = { path = "crates/qv-net" }
qv-mempool     = { path = "crates/qv-mempool" }
qv-defi        = { path = "crates/qv-defi" }

[profile.dev]
opt-level       = 0
debug           = true
overflow-checks = true

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = false
strip         = "symbols"
panic         = "abort"
overflow-checks = true   # blockchain: keep overflow checks in release too

[profile.bench]
opt-level = 3
lto       = "thin"
debug     = true

# Profile for running tests with sanitizer-like stri
