[workspace]
resolver = "2"
members = [
    "crates/qv-common",
    "crates/qv-crypto",
    "crates/qv-core",
    "crates/qv-script",
    "crates/qv-consensus",
    "crates/qv-privacy",
    "crates/qv-storage",
    "crates/qv-net",
    "crates/qv-mempool",
    "crates/qv-defi",
    "crates/qv-node",
    "crates/qv-wallet",
    "crates/qv-miner",
]
# Spikes are throwaway scratch projects used to verify external crate APIs
# before committing to dependency changes. They are NOT part of the workspace
# build (so `cargo build --workspace` skips them).
exclude = ["spikes"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.86"
license      = "Apache-2.0 OR MIT"
authors      = ["QuantumVault Contributors"]
repository   = "https://github.com/quantumvault/quantumvault"

[workspace.lints.rust]
unsafe_code                 = "deny"
# `missing_docs` is intentionally relaxed during the scaffolding phase.
# Re-enable as `warn` (or `deny`) in Faz 9 (audit-ready) — see docs/ROADMAP.md.
missing_docs                = "allow"
# Lint groups must have lower priority than individual lints to avoid Cargo's
# "same priority" conflict; clippy::lint_groups_priority enforces this since
# 1.75.
rust_2018_idioms            = { level = "warn", priority = -1 }
unreachable_pub             = "warn"
unused_qualifications       = "warn"

[workspace.lints.clippy]
# `clippy::all` covers correctness + suspicious + style + complexity + perf —
# the lint categories that catch real bugs. `pedantic` and `nursery` add
# hundreds of opinionated/experimental lints that produce significant CI
# noise without commensurate signal. They are intentionally disabled during
# the scaffolding phase; Faz 9 (audit prep) re-enables them with a fine-grained
# allow-list (see docs/ROADMAP.md).
all              = { level = "warn", priority = -1 }
# Cosmetic noise the `all` group catches but isn't worth blocking CI for:
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
# Cryptographic math (qv-crypto::threshold field arithmetic, KES Merkle tree,
# secure_bytes resize, hybrid_kem byte splits) heavily uses fixed-size array
# indexing/slicing where bounds are derived from compile-time constants or
# already-validated upstream lengths. The lint is too noisy for this codebase
# and the actual safety property is already enforced by `#![forbid(unsafe_code)]`.
# Under CI's `-D warnings` flag `warn` would still fail, so we explicitly allow.
# Faz 9 (audit prep) will re-enable per-file with surgical #[allow] blocks.
indexing_slicing   = "allow"
# Same reasoning: `merkle.len() / 2`, `2 ^ depth` etc. are routine binary
# arithmetic, not the float-confusion this lint is designed to catch.
integer_division   = "allow"
# Blake3's `Hasher` is ~1900 bytes (NTT-style internal state). Boxing it
# in our hash dispatcher's `Hasher` enum would add a heap allocation on
# the hot path; the codebase only constructs one variant at a time.
large_enum_variant = "allow"
# `to_inner(&self) -> ...` on `Copy` types reads more naturally as a borrow
# for clarity; the lint is style-only.
wrong_self_convention = "allow"
# Safety-critical lints — production code must propagate errors, not panic.
# Test modules opt-out via `#[allow(clippy::unwrap_used, ...)]` locally.
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
float_arithmetic   = "deny"

[workspace.dependencies]
# --- async / runtime ---
tokio      = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7" }
futures    = "0.3"

# --- error / logging ---
thiserror  = "1.0"
anyhow     = "1.0"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- serialization ---
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode    = "1.3"
hex        = "0.4"
rkyv       = { version = "0.7", features = ["validation"] }

# --- crypto (classical) ---
sha3             = "0.10"
blake3           = "=1.5.4"
x25519-dalek     = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek    = "2.1"
curve25519-dalek = "4.1"
rand_core        = { version = "0.6", features = ["getrandom"] }
rand             = "0.8"
zeroize          = { version = "1.7", features = ["zeroize_derive"] }
secrecy          = "0.8"
subtle           = "2.5"

# --- crypto (post-quantum) ---
# Dilithium / ML-DSA: per ADR-006 (2026-05-07) we use RustCrypto's `ml-dsa`
# crate (FIPS 204 final). pqcrypto-dilithium 0.5 (NIST round-3) was removed
# because its wire format (sk: 4000 B, sig: 3293 B) is incompatible with
# FIPS 204 (sk: 4032 B, sig: 3309 B). Verified deterministic seeded keygen
# via `<MlDsa65 as KeyGen>::key_gen_internal(&B32)` (closes envanter C-04 + C-06).
ml-dsa              = "=0.0.4"
# Kyber KEM: still uses pqcrypto wrapper (Kyber stayed compatible across
# rounds). `pqcrypto-traits` retained for the Kyber side only.
pqcrypto-kyber      = "0.8"
pqcrypto-traits     = "0.3"

# --- VRF (Ouroboros Praos slot-leader election) ---
# schnorrkel: Ristretto255-VRF (IETF draft-irtf-cfrg-vrf-15 ECVRF-RISTRETTO255-SHA512).
# Per ADR-004; v2 hibrit lattice geçişi planlı, trait arkasında soyutlandı.
schnorrkel          = { version = "0.11", default-features = false, features = ["std", "getrandom"] }
merlin              = "3"

# --- storage ---
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
redb    = "=2.1.3"

# --- networking ---
libp2p = { version = "0.54", features = [
    "tokio", "tcp", "noise", "yamux", "gossipsub",
    "kad", "identify", "ping", "macros", "request-response"
] }

# --- rpc ---
jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }
async-trait = "0.1"

# --- metrics ---
metrics = "0.22"
metrics-exporter-prometheus = "0.14"

# --- utility ---
parking_lot    = "0.12"
dashmap        = "5.5"
arc-swap       = "1.7"
smallvec       = { version = "1.13", features = ["union", "serde"] }
bytes          = "1.6"
clap           = { version = "4.5", features = ["derive", "env"] }
config         = "0.14"
toml           = "0.8"

# --- wallet & crypto utilities ---
bip39              = { version = "2", features = ["rand"] }
argon2             = "0.5"
password-hash      = "0.5"
aes-gcm            = "0.10"
base64             = "0.22"
pbkdf2             = "0.12"
hmac               = "0.12"
sha2               = "0.10"
rpassword          = "=7.3"
tempfile           = "3.10"

# --- http client (wallet RPC) ---
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- http server (wallet UI; ADR-011 Faz 5) ---
# axum 0.7 reuses the same hyper 1 stack that jsonrpsee already pulls in.
# `query` is needed by `Query<...>` extractor used in QR-parts endpoint.
axum               = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }

# --- QR rendering (wallet UI; ADR-011 Faz 5) ---
# Default features pull the `image` crate (~4 MB of deps); we only need
# SVG + the always-present Unicode renderer for CLI ASCII output.
qrcode             = { version = "0.14", default-features = false, features = ["svg"] }

# --- testing / benchmarking ---
criterion      = { version = "0.5", features = ["html_reports"] }
proptest       = "1.4"
quickcheck     = "1.0"
mockall        = "0.12"

# --- internal crate aliases ---
qv-common      = { path = "crates/qv-common" }
qv-crypto      = { path = "crates/qv-crypto" }
qv-core        = { path = "crates/qv-core" }
qv-script      = { path = "crates/qv-script" }
qv-consensus   = { path = "crates/qv-consensus" }
qv-privacy     = { path = "crates/qv-privacy" }
qv-storage     = { path = "crates/qv-storage" }
qv-net         = { path = "crates/qv-net" }
qv-mempool     = { path = "crates/qv-mempool" }
qv-defi        = { path = "crates/qv-defi" }
qv-wallet      = { path = "crates/qv-wallet" }

[profile.dev]
opt-level       = 0
debug           = true
overflow-checks = true

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = false
strip         = "symbols"
panic         = "abort"
overflow-checks = true   # blockchain: keep overflow checks in release too

[profile.bench]
opt-level = 3
lto       = "thin"
debug     = true

# Profile for performance profiling (flamegraph, perf)
[profile.profiling]
inherits      = "release"
debug         = true
strip         = "none"
lto           = "thin"
codegen-units = 16
