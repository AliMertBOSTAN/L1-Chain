[package]
name         = "qv-node"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "QuantumVault full node daemon."

[lints]
workspace = true

[lib]
name = "qv_node"
path = "src/lib.rs"

[[bin]]
name = "qv-node"
path = "src/main.rs"
# The bin is a thin wrapper around `qv_node` library; it has no tests of its
# own and re-linking it under the test profile pulls librocksdb_sys (a *-sys
# crate with `links = "rocksdb"`) which Cargo refuses to expose as rlib for
# the test target. All real coverage lives in `tests/` and the library.
test = false
doctest = false
bench = false

[dependencies]
# Internal crates
qv-common    = { workspace = true }
qv-core      = { workspace = true }
qv-crypto    = { workspace = true }
qv-consensus = { workspace = true }
qv-storage   = { workspace = true }
qv-net       = { workspace = true }
qv-mempool   = { workspace = true }
qv-script    = { workspace = true }
qv-privacy   = { workspace = true }
qv-wallet    = { workspace = true }
# Faz 6 D-5: `qv_listPools` decodes canonical PoolDatum bytes. No cycle:
# qv-defi depends only on qv-common/qv-core/qv-script/qv-crypto.
qv-defi      = { workspace = true }

# Async runtime
tokio          = { workspace = true }
futures        = { workspace = true }

# Logging and error handling
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }

# CLI and config
clap = { workspace = true }
toml = { workspace = true }
config = { workspace = true }

# RPC and serialization
jsonrpsee = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Utilities
hex = "0.4"

# Metrics — `http-listener` only. The default `push-gateway` feature pulls
# hyper-tls -> native-tls -> openssl-sys, which needs system OpenSSL dev
# headers; the pull-based Prometheus endpoint we use needs only http-listener.
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.14", default-features = false, features = ["http-listener"] }
