[package]
name         = "qv-crypto"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Post-quantum + classical cryptographic primitives (hash, PQC signatures, hybrid KEM, VRF)."

[lints]
workspace = true

[dependencies]
qv-common           = { workspace = true }

# Hashes
sha3                = { workspace = true }
blake3              = { workspace = true }

# Classical asymmetric
x25519-dalek        = { workspace = true }

# Post-quantum
# Dilithium / ML-DSA: per ADR-006 (2026-05-07), full swap to RustCrypto's
# `ml-dsa` 0.0.4 (FIPS 204 final). pqcrypto-dilithium 0.5 (NIST round-3) was
# wire-incompatible (sk/sig sizes differ). ml-dsa offers verified deterministic
# seeded keygen via `<MlDsaP as KeyGen>::key_gen_internal(&B32)` — closes
# envanter C-04 + C-06.
ml-dsa              = { workspace = true }
# Kyber stays on pqcrypto wrapper (KEM side unaffected by FIPS 204 transition).
pqcrypto-kyber      = { workspace = true }
pqcrypto-traits     = { workspace = true }

# Ristretto255-VRF for Ouroboros Praos slot leader election (ADR-004).
# C-07 (schnorrkel API verify) closed 2026-05-07 — full workspace tests green.
schnorrkel          = { workspace = true }
merlin              = { workspace = true }

# Secret-material hygiene
zeroize             = { workspace = true }
subtle              = { workspace = true }

# RNG (OsRng) — rand_core is lighter than rand and enough for our needs.
rand_core           = { workspace = true, features = ["getrandom"] }

# Errors / serde / display
thiserror           = { workspace = true }
hex                 = { workspace = true }
serde               = { workspace = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }
bincode   = { workspace = true }

[[bench]]
name    = "crypto_bench"
harness = false
